  <title>掲載情報の訂正・削除依頼｜AV Guide</title>
  <meta name="description" content="AV Guideに掲載された情報の訂正、掲載終了、削除、権利侵害を連絡するページです。">
  <meta name="robots" content="index,follow">
  <meta property="og:type" content="website">
  <meta property="og:title" content="掲載情報の訂正・削除依頼｜AV Guide">
  <meta property="og:description" content="掲載情報の訂正・削除依頼窓口です。">
  <link rel="canonical" href="https://av-guide-japan.netlify.app/correction.html">

</head>
<body>
  <div class="app-shell">
    <div id="siteHeader"></div>
    <main>
      <section class="page-hero"><p class="eyebrow">CORRECTION</p><h1>掲載情報の訂正・削除依頼</h1><p>掲載情報に誤りがある場合や、権利上の問題がある場合は、こちらからご連絡ください。内容を確認したうえで対応します。</p></section>
      <section class="section">
        <p class="prep-note">対象ページURL、女優名または店舗名、依頼内容を記載してメールでお送りください。</p>
        <a class="text-link" href="mailto:avguide_contact@ymail.ne.jp">avguide_contact@ymail.ne.jp</a>
        <form class="form-card" id="correctionForm"><label for="targetUrl">対象ページURL</label><input id="targetUrl" type="url" placeholder="https://"><label for="targetName">女優名または店舗名</label><input id="targetName" type="text"><label for="requestType">依頼種別</label><select id="requestType"><option>情報訂正</option><option>掲載終了</option><option>削除依頼</option><option>権利侵害の申告</option><option>その他</option></select><label for="requestMessage">依頼内容</label><textarea id="requestMessage" rows="7"></textarea><label for="requestEmail">連絡先メールアドレス</label><input id="requestEmail" type="email" autocomplete="email"><button type="submit">送信する</button><p class="form-status" id="correctionStatus" aria-live="polite" hidden></p></form>
      </section>
    </main>
    <div id="siteFooter"></div>
  </div>
  <script src="script.js"></script>
